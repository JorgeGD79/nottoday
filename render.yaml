# Render Blueprint — despliegue en modo DEMO (sin Stripe real).
# Crea: base de datos Postgres + Redis (Key Value) + el servicio web (API + tienda).
# Los 2 workers van comentados al final: son OPCIONALES en demo y requieren plan de pago.

databases:
  - name: nottoday-db
    databaseName: nottoday
    user: nottoday
    plan: free            # gratis ~30 días; súbelo a un plan de pago para producción
    region: frankfurt

services:
  # Redis / Key Value — cola de BullMQ + almacén del rate-limit
  - type: redis
    name: nottoday-redis
    plan: free
    region: frankfurt
    ipAllowList: []        # [] = accesible solo desde tus servicios (red interna)

  # API Fastify + frontend estático (public/). Aplica migraciones al arrancar.
  - type: web
    name: nottoday-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free             # el plan free "duerme" tras 15 min de inactividad
    healthCheckPath: /health
    autoDeploy: true
    # Comando SIN operadores de shell (Render trocea los "&&" y los rompe).
    # La secuencia migrate + start vive en docker-entrypoint.sh.
    dockerCommand: sh docker-entrypoint.sh
    envVars:
      - key: NODE_ENV
        value: development          # demo: relaja validaciones y permite pago simulado
      - key: CHECKOUT_SKIP_STRIPE
        value: "true"               # pagos simulados (pedidos marcados PAGADO)
      - key: TRUST_PROXY
        value: "1"                  # Render sirve tras su proxy: 1 salto de confianza (IP real)
      - key: CORS_ORIGIN
        value: "*"                  # válido en development; el frontend es same-origin
      - key: JWT_SECRET
        generateValue: true         # Render genera un secreto fuerte automáticamente
      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: STRIPE_SECRET_KEY
        value: sk_test_dummy        # no se usa en demo, pero el schema exige que exista
      - key: SEED_ADMIN_EMAIL
        value: admin@nottoday.com
      - key: SEED_ADMIN_PASSWORD
        generateValue: true         # léela en el panel de Render para el primer login
      # Cloudinary (subida de fotos). sync:false = las metes a mano en el dashboard
      # de Render (Environment), no se guardan en git.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nottoday-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nottoday-redis
          type: redis
          property: connectionString


<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>NOT TODAY - Store</title>
<link href="favicon.jpg" rel="icon" type="image/jpeg"/>
<link href="favicon.jpg" rel="apple-touch-icon"/>
<link href="manifest.webmanifest" rel="manifest"/>
<meta content="#131313" name="theme-color"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind.config.js?v=3"></script>
<link href="assets/css/site.css?v=8" rel="stylesheet"/>
<meta name="description" content="Tienda oficial de NOT TODAY: ropa, joyas, drops exclusivos y merch del colectivo."/>
<style>
    .nt-filter { background: transparent; border: 1px solid rgb(68 71 72); color: inherit; font-family: "JetBrains Mono", monospace; font-size: 12px; text-transform: uppercase; padding: 0.45rem 2rem 0.45rem 0.6rem; cursor: pointer; }
    .nt-filter:focus { outline: none; border-color: #ff8a00; box-shadow: none; }
    .nt-filter option { background: #131313; }
</style>
</head>
<body class="min-h-screen flex flex-col font-body-md antialiased selection:bg-secondary-container selection:text-on-secondary pb-28 md:pb-0">

<main class="flex-grow pt-[140px] pb-stack-lg">
    <!-- Header -->
    <header class="px-margin-mobile md:px-margin-desktop pb-stack-lg border-b border-outline-variant/20">
        <h1 class="font-display-lg text-display-lg uppercase text-on-surface tracking-tighter leading-none mb-stack-sm">
            Gear <br class="md:hidden"/><span class="text-secondary-container opacity-80">Supply</span>
        </h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl border-l-2 border-secondary-container pl-4 mt-stack-md">
            Diseñamos nuestras piezas desde cero, con nuestra propia visión. Algodón pesado, bordes crudos, cada textura parte de lo que somos. Sin concesiones.
        </p>
    </header>

    <!-- Drops exclusivos -->
    <section id="drops" class="hidden px-margin-mobile md:px-margin-desktop py-stack-lg border-b border-outline-variant/20">
        <div class="flex items-end justify-between border-b border-on-surface pb-stack-sm mb-stack-lg">
            <h2 class="font-headline-xl text-headline-xl text-on-surface uppercase tracking-tighter">Drops</h2>
            <span class="font-label-mono text-label-mono text-secondary-container uppercase">Limited — no restock</span>
        </div>
        <div class="nt-grid-lines grid-cols-1 md:grid-cols-2 lg:grid-cols-3" id="drops-grid"></div>
    </section>

    <!-- Joyas (productos de la categoría "joyas"; oculta si no hay ninguno) -->
    <section id="joyas" class="hidden scroll-mt-[120px] px-margin-mobile md:px-margin-desktop py-stack-lg border-b border-outline-variant/20">
        <div class="flex items-end justify-between border-b border-on-surface pb-stack-sm mb-stack-lg">
            <h2 class="font-headline-xl text-headline-xl text-on-surface uppercase tracking-tighter">Joyas</h2>
            <button id="joyas-all" class="hidden font-label-mono text-label-mono text-secondary-container uppercase hover:text-on-surface">Ver todas →</button>
        </div>
        <div class="nt-grid-lines grid-cols-1 md:grid-cols-2 lg:grid-cols-3" id="joyas-grid"></div>
    </section>

    <!-- Búsqueda y filtros (se reflejan en la URL: ?q=&categoria=&talla=&color=&stock=1&orden=) -->
    <div class="sticky top-[104px] z-40 bg-background/95 backdrop-blur-md border-b border-outline-variant/20 px-margin-mobile md:px-margin-desktop py-stack-sm flex flex-col gap-3">
        <div class="flex flex-col md:flex-row gap-3 md:items-center">
            <div class="flex-1 flex items-center border border-outline-variant bg-surface-container-lowest">
                <span class="material-symbols-outlined text-on-surface-variant px-3">search</span>
                <input id="f-q" type="search" placeholder="BUSCAR" aria-label="Buscar productos"
                    class="flex-1 bg-transparent border-none outline-none focus:ring-0 text-on-surface font-label-mono text-label-mono uppercase py-2 pr-3"/>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                <select id="f-category" aria-label="Categoría" class="nt-filter"><option value="">Categoría: todas</option></select>
                <select id="f-size" aria-label="Talla" class="nt-filter"><option value="">Talla: todas</option></select>
                <select id="f-color" aria-label="Color" class="nt-filter hidden"><option value="">Color: todos</option></select>
                <label class="flex items-center gap-2 font-label-mono text-label-mono text-on-surface-variant uppercase cursor-pointer">
                    <input id="f-stock" type="checkbox" class="bg-transparent border-outline-variant text-secondary-container focus:ring-0"/> En stock
                </label>
                <select id="sort-select" aria-label="Ordenar" class="nt-filter">
                    <option value="latest">Novedades</option>
                    <option value="price-asc">Precio: menor a mayor</option>
                    <option value="price-desc">Precio: mayor a menor</option>
                    <option value="name">Nombre</option>
                </select>
            </div>
        </div>
        <div class="flex items-center justify-between gap-3">
            <span class="font-label-mono text-label-mono text-on-surface-variant uppercase" id="catalog-count">Cargando catálogo...</span>
            <button id="f-clear" class="hidden font-label-mono text-[11px] text-secondary-container uppercase tracking-widest hover:text-on-surface">Quitar filtros ×</button>
        </div>
    </div>

    <!-- Grid de productos -->
    <div class="nt-grid-lines grid-cols-1 md:grid-cols-2 lg:grid-cols-3 mt-px" id="products-grid">
        <div class="p-stack-md"><div class="nt-skeleton aspect-[4/5]"></div></div>
        <div class="p-stack-md hidden md:block"><div class="nt-skeleton aspect-[4/5]"></div></div>
        <div class="p-stack-md hidden lg:block"><div class="nt-skeleton aspect-[4/5]"></div></div>
    </div>
    <div class="flex justify-center py-stack-lg">
        <button id="load-more" class="hidden border-2 border-on-surface text-on-surface font-headline-lg text-headline-lg-mobile uppercase px-8 py-2 hover:bg-on-surface hover:text-primary-container transition-colors">Cargar más</button>
    </div>
</main>

<script src="assets/js/api.js"></script>
<script src="assets/js/chrome.js"></script>
<script>NTChrome.mount({ active: "store" });</script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/product-ui.js"></script>
<script>
    // Índice producto/variantes para resolver la variante elegida al añadir al carrito.
    const productIndex = new Map();
    let catalog = [];
    let page = 1;
    let totalPages = 1;
    const PAGE_SIZE = 24;

    // ------- Filtros <-> URL -------
    const F = {
        q: document.getElementById("f-q"),
        category: document.getElementById("f-category"),
        size: document.getElementById("f-size"),
        color: document.getElementById("f-color"),
        stock: document.getElementById("f-stock"),
        sort: document.getElementById("sort-select"),
    };
    const URL_KEYS = { q: "q", category: "categoria", size: "talla", color: "color", sort: "orden" };

    function filtersFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return {
            q: params.get("q") || "",
            category: params.get("categoria") || "",
            size: params.get("talla") || "",
            color: params.get("color") || "",
            stock: params.get("stock") === "1",
            sort: params.get("orden") || "latest",
        };
    }

    function currentFilters() {
        return {
            q: F.q.value.trim(),
            category: F.category.value,
            size: F.size.value,
            color: F.color.value,
            stock: F.stock.checked,
            sort: F.sort.value,
        };
    }

    function syncUrl(f) {
        const params = new URLSearchParams(window.location.search);
        for (const [k, key] of Object.entries(URL_KEYS)) {
            if (f[k] && !(k === "sort" && f[k] === "latest")) params.set(key, f[k]); else params.delete(key);
        }
        if (f.stock) params.set("stock", "1"); else params.delete("stock");
        const qs = params.toString();
        history.replaceState(null, "", `${window.location.pathname}${qs ? `?${qs}` : ""}${window.location.hash}`);
        document.getElementById("f-clear").classList.toggle("hidden", !(f.q || f.category || f.size || f.color || f.stock));
    }

    function fillSelect(el, placeholder, options, selected) {
        el.innerHTML = `<option value="">${placeholder}</option>` + options
            .map(([v, l]) => `<option value="${ntEscapeHtml(v)}" ${v === selected ? "selected" : ""}>${ntEscapeHtml(l)}</option>`)
            .join("");
    }

    async function loadFacets(initial) {
        try {
            const facets = await ntApi("/shop/facets");
            fillSelect(F.category, "Categoría: todas", facets.categories.map((c) => [c.slug, `${c.name} (${c.count})`]), initial.category);
            fillSelect(F.size, "Talla: todas", facets.sizes.map((s) => [s, s]), initial.size);
            fillSelect(F.color, "Color: todos", facets.colors.map((c) => [c, c]), initial.color);
            F.category.classList.toggle("hidden", !facets.categories.length);
            F.color.classList.toggle("hidden", !facets.colors.length);
        } catch {
            /* sin facetas los filtros quedan en "todas" */
        }
    }

    // ------- Tarjetas -------
    function productCard(product, { badge = null, disabled = false } = {}) {
        const soldOut = NTProductUI.isSoldOut(product);
        const isBlocked = disabled || soldOut;
        const badgeText = badge || (soldOut ? "Agotado" : product.category ? product.category.name : "Activo");
        const badgeClasses = soldOut
            ? "border-outline text-outline"
            : "border-secondary-container text-secondary-container";
        const single = product.variants.length === 1;
        const variantBtns = single ? "" : product.variants.map((v) => `
            <button class="size-btn" data-product="${product.id}" data-variant="${v.id}"
                ${v.stockAvailable <= 0 ? "disabled" : ""}
                title="${v.stockAvailable <= 0 ? "Agotado" : `${v.stockAvailable} disponibles`}">
                ${ntEscapeHtml(ntVariantLabel(v))}
            </button>`).join("");
        if (single && !soldOut) selectedVariant.set(product.id, product.variants[0].id);
        return `
        <article class="group relative flex flex-col p-stack-md border border-transparent hover:border-secondary-container transition-colors" data-product-card="${product.id}">
            <div data-view="${product.id}" class="relative w-full aspect-[4/5] bg-surface-container overflow-hidden cursor-pointer">
                <img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500 group-hover:scale-[1.03]"
                     src="${ntProductImage(product)}" alt="${ntEscapeHtml(product.name)}" loading="lazy"/>
                ${soldOut ? `<div class="absolute inset-0 flex items-center justify-center bg-primary-container/70">
                    <span class="bg-secondary-container text-on-secondary px-3 py-1 font-label-mono text-[12px] uppercase font-bold">Sold Out</span>
                </div>` : ""}
            </div>
            <div class="mt-stack-md flex flex-col flex-grow gap-stack-sm">
                <div class="flex justify-between items-start gap-2">
                    <h2 class="font-headline-lg text-headline-lg-mobile text-on-surface uppercase leading-none pr-2">
                        <a href="${NTProductUI.productUrl(product)}" class="hover:text-secondary-container transition-colors">${ntEscapeHtml(product.name)}</a>
                    </h2>
                    <span class="font-label-mono text-[10px] font-semibold tracking-widest px-2 py-1 border ${badgeClasses} uppercase whitespace-nowrap">${ntEscapeHtml(badgeText)}</span>
                </div>
                <span class="font-label-mono text-label-mono text-secondary-container">${ntFormatMoney(product.price)}</span>
                ${product.description ? `<p class="font-body-md text-[14px] text-on-surface-variant line-clamp-2">${ntEscapeHtml(product.description)}</p>` : ""}
                ${variantBtns ? `<div class="flex gap-2 flex-wrap" data-sizes>${variantBtns}</div>` : ""}
                <div class="mt-auto pt-stack-md">
                    ${isBlocked
                        ? `<button data-view-btn="${product.id}"
                              class="w-full bg-transparent border-2 border-secondary-container text-secondary-container font-headline-lg text-headline-lg-mobile uppercase py-2 hover:bg-secondary-container hover:text-on-secondary transition-colors">
                              Avísame
                           </button>`
                        : `<button data-add-to-cart="${product.id}"
                              class="w-full bg-transparent border-2 border-on-surface text-on-surface font-headline-lg text-headline-lg-mobile uppercase py-2 hover:bg-on-surface hover:text-primary-container transition-colors disabled:opacity-30 disabled:cursor-not-allowed">
                              Add to Cart
                           </button>`}
                </div>
            </div>
        </article>`;
    }

    // Variante seleccionada por producto
    const selectedVariant = new Map();

    function wireCards(container) {
        // Clic en la imagen (o en "Avísame") → abre el detalle del producto.
        container.querySelectorAll("[data-view], [data-view-btn]").forEach((el) => {
            el.addEventListener("click", () => {
                const p = productIndex.get(el.dataset.view || el.dataset.viewBtn);
                if (p) openProductModal(p);
            });
        });

        container.querySelectorAll(".size-btn:not(:disabled)").forEach((btn) => {
            btn.addEventListener("click", () => {
                const productId = btn.dataset.product;
                btn.closest("[data-sizes]").querySelectorAll(".size-btn").forEach((b) => b.classList.remove("selected"));
                btn.classList.add("selected");
                selectedVariant.set(productId, btn.dataset.variant);
            });
        });

        container.querySelectorAll("[data-add-to-cart]:not(:disabled)").forEach((btn) => {
            btn.addEventListener("click", async () => {
                const productId = btn.dataset.addToCart;
                const productVariantId = selectedVariant.get(productId);
                if (!productVariantId) {
                    ntToast("Elige una talla primero", true);
                    return;
                }
                btn.disabled = true;
                try {
                    await NTCart.add({ productId, productVariantId, quantity: 1 });
                    ntToast("Añadido al carrito");
                } catch (err) {
                    ntToast(err.message, true);
                } finally {
                    btn.disabled = false;
                }
            });
        });
    }

    // ------- Catálogo general (filtrado y paginado en el servidor) -------
    let loadSeq = 0;
    async function loadCatalog({ append = false } = {}) {
        const f = currentFilters();
        syncUrl(f);
        const seq = ++loadSeq;
        const params = new URLSearchParams({ page: append ? page + 1 : 1, pageSize: PAGE_SIZE, sort: f.sort });
        if (f.q) params.set("q", f.q);
        if (f.category) params.set("category", f.category);
        if (f.size) params.set("size", f.size);
        if (f.color) params.set("color", f.color);
        if (f.stock) params.set("inStock", "true");

        const grid = document.getElementById("products-grid");
        try {
            const { products, pagination } = await ntApi(`/shop?${params}`);
            if (seq !== loadSeq) return; // llegó una búsqueda más reciente
            page = pagination.page;
            totalPages = pagination.totalPages;
            products.forEach((p) => productIndex.set(p.id, p));
            catalog = append ? catalog.concat(products) : products;
            document.getElementById("catalog-count").textContent =
                `${pagination.total} producto${pagination.total === 1 ? "" : "s"}`;
            document.getElementById("load-more").classList.toggle("hidden", page >= totalPages);

            if (!catalog.length) {
                grid.innerHTML = `<div class="md:col-span-2 lg:col-span-3 p-stack-lg text-center">
                    <p class="font-label-mono text-label-mono text-on-surface-variant uppercase">${f.q || f.category || f.size || f.color || f.stock ? "Nada coincide con esos filtros." : "El catálogo está vacío por ahora."}</p>
                </div>`;
                return;
            }
            if (append) {
                const tmp = document.createElement("div");
                tmp.innerHTML = products.map((p) => productCard(p)).join("");
                const nodes = [...tmp.children];
                nodes.forEach((n) => grid.appendChild(n));
                nodes.forEach((n) => wireCards(n));
            } else {
                grid.innerHTML = catalog.map((p) => productCard(p)).join("");
                wireCards(grid);
            }
        } catch (err) {
            document.getElementById("catalog-count").textContent = "Error";
            grid.innerHTML =
                `<div class="md:col-span-2 lg:col-span-3 p-stack-lg text-center">
                    <p class="font-label-mono text-label-mono text-error uppercase">${ntEscapeHtml(err.message)}</p>
                </div>`;
        }
    }

    // ------- Drops -------
    const dropTimers = [];
    function dropCountdown(el, releaseAt) {
        const target = new Date(releaseAt).getTime();
        const tick = () => {
            const diff = target - Date.now();
            if (diff <= 0) {
                el.textContent = "LIVE NOW — refresca la página";
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            el.textContent = `${d}D ${String(h).padStart(2, "0")}H ${String(m).padStart(2, "0")}M ${String(s).padStart(2, "0")}S`;
        };
        tick();
        dropTimers.push(setInterval(tick, 1000));
    }

    async function loadDrops() {
        try {
            const { drops } = await ntApi("/drops");
            const relevant = drops.filter((d) => d.dropMeta.dropStatus !== "FINALIZADO");
            if (!relevant.length) return;

            document.getElementById("drops").classList.remove("hidden");
            const grid = document.getElementById("drops-grid");
            grid.innerHTML = relevant
                .map((drop) => {
                    const isOpen = drop.dropMeta.dropStatus === "ABIERTO";
                    productIndex.set(drop.id, drop);
                    const card = productCard(drop, {
                        badge: isOpen ? "Drop — Live" : "Próximamente",
                        disabled: !isOpen,
                    });
                    return isOpen
                        ? card
                        : card.replace(
                              "</article>",
                              `<div class="absolute top-2 right-2 bg-secondary-container text-on-secondary px-2 py-1 font-label-mono text-[12px] uppercase font-bold" data-countdown="${drop.dropMeta.releaseAt}"></div></article>`
                          );
                })
                .join("");
            wireCards(grid);
            grid.querySelectorAll("[data-countdown]").forEach((el) => dropCountdown(el, el.dataset.countdown));
        } catch {
            /* la sección de drops permanece oculta si la API falla */
        }
    }

    // ------- Joyas -------
    const JEWELRY_CATEGORY = "joyas";
    const JEWELRY_PREVIEW = 6;
    async function loadJewelry() {
        try {
            const params = new URLSearchParams({ category: JEWELRY_CATEGORY, pageSize: JEWELRY_PREVIEW, sort: "latest" });
            const { products, pagination } = await ntApi(`/shop?${params}`);
            if (!products.length) return;
            products.forEach((p) => productIndex.set(p.id, p));
            const grid = document.getElementById("joyas-grid");
            grid.innerHTML = products.map((p) => productCard(p)).join("");
            wireCards(grid);
            document.getElementById("joyas").classList.remove("hidden");
            if (pagination.total > products.length) {
                const all = document.getElementById("joyas-all");
                all.textContent = `Ver todas (${pagination.total}) →`;
                all.classList.remove("hidden");
            }
            // El enlace del menú (store.html#joyas) llega con la sección aún oculta.
            if (window.location.hash === "#joyas") document.getElementById("joyas").scrollIntoView();
        } catch {
            /* la sección de joyas permanece oculta si la API falla */
        }
    }
    document.getElementById("joyas-all").addEventListener("click", () => {
        F.category.value = JEWELRY_CATEGORY;
        loadCatalog();
        document.getElementById("catalog-count").scrollIntoView({ behavior: "smooth", block: "center" });
    });

    // ===================== Modal de detalle de producto =====================
    function mountProductModal() {
        const root = document.createElement("div");
        root.id = "pm-root";
        root.className = "hidden fixed inset-0 z-[700]";
        root.innerHTML = `
            <div id="pm-backdrop" class="absolute inset-0 bg-primary-container/90 backdrop-blur-sm"></div>
            <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
                <div id="pm-panel" class="bg-surface-container-lowest border border-outline-variant w-full max-w-4xl max-h-[90vh] overflow-y-auto pointer-events-auto relative"></div>
            </div>`;
        document.body.appendChild(root);
        root.querySelector("#pm-backdrop").addEventListener("click", closeProductModal);
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeProductModal(); });
    }

    function openProductModal(product) {
        document.getElementById("pm-root").classList.remove("hidden");
        document.body.style.overflow = "hidden";
        NTProductUI.mount(document.getElementById("pm-panel"), product, {
            modal: true,
            onClose: closeProductModal,
            onAdded: closeProductModal,
        });
    }

    function closeProductModal() {
        const root = document.getElementById("pm-root");
        if (root) root.classList.add("hidden");
        document.body.style.overflow = "";
    }

    // ------- Arranque -------
    mountProductModal();

    const initial = filtersFromUrl();
    F.q.value = initial.q;
    F.stock.checked = initial.stock;
    F.sort.value = initial.sort;
    loadFacets(initial).then(() => loadCatalog());
    loadDrops();
    loadJewelry();

    let searchTimer = null;
    F.q.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => loadCatalog(), 300);
    });
    [F.category, F.size, F.color, F.stock, F.sort].forEach((el) => el.addEventListener("change", () => loadCatalog()));
    document.getElementById("f-clear").addEventListener("click", () => {
        F.q.value = ""; F.category.value = ""; F.size.value = ""; F.color.value = ""; F.stock.checked = false;
        loadCatalog();
    });
    document.getElementById("load-more").addEventListener("click", () => loadCatalog({ append: true }));

    // Vuelta de Stripe (return_url): confirmación del pago
    const params = new URLSearchParams(window.location.search);
    if (params.get("redirect_status") === "succeeded") {
        ntToast("Pago completado. ¡Gracias!");
    } else if (params.get("order")) {
        ntToast(`Pedido ${params.get("order")} registrado`);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NOT TODAY - Store</title>
<link href="favicon.jpg" rel="icon" type="image/jpeg"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind.config.js?v=3"></script>
<link href="assets/css/site.css?v=7" rel="stylesheet"/>
</head>
<body class="min-h-screen flex flex-col font-body-md antialiased selection:bg-secondary-container selection:text-on-secondary pb-24 md:pb-0">

<main class="flex-grow pt-[140px] pb-stack-lg">
    <!-- Header -->
    <header class="px-margin-mobile md:px-margin-desktop pb-stack-lg border-b border-outline-variant/20">
        <h1 class="font-display-lg text-display-lg uppercase text-on-surface tracking-tighter leading-none mb-stack-sm">
            Gear <br class="md:hidden"/><span class="text-secondary-container opacity-80">Supply</span>
        </h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl border-l-2 border-secondary-container pl-4 mt-stack-md">
            Diseñamos nuestras piezas desde cero, con nuestra propia visión. Algodón pesado, bordes crudos, cada textura parte de lo que somos. Sin concesiones.
        </p>
    </header>

    <!-- Drops exclusivos -->
    <section id="drops" class="hidden px-margin-mobile md:px-margin-desktop py-stack-lg border-b border-outline-variant/20">
        <div class="flex items-end justify-between border-b border-on-surface pb-stack-sm mb-stack-lg">
            <h2 class="font-headline-xl text-headline-xl text-on-surface uppercase tracking-tighter">Drops</h2>
            <span class="font-label-mono text-label-mono text-secondary-container uppercase">Limited — no restock</span>
        </div>
        <div class="nt-grid-lines grid-cols-1 md:grid-cols-2 lg:grid-cols-3" id="drops-grid"></div>
    </section>

    <!-- Ordenación -->
    <div class="sticky top-[104px] z-40 bg-background/95 backdrop-blur-md border-b border-outline-variant/20 px-margin-mobile md:px-margin-desktop py-stack-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-stack-md">
        <span class="font-label-mono text-label-mono text-on-surface-variant uppercase" id="catalog-count">Cargando catálogo...</span>
        <div class="flex items-center gap-base">
            <span class="font-label-mono text-label-mono text-on-surface-variant uppercase">Sort:</span>
            <select id="sort-select" class="bg-surface-container-lowest border border-outline-variant text-on-surface font-label-mono text-label-mono uppercase p-2 focus:ring-0 focus:border-secondary-container outline-none appearance-none cursor-pointer">
                <option value="latest">Latest</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="price-asc">Price: Low to High</option>
            </select>
        </div>
    </div>

    <!-- Grid de productos -->
    <div class="nt-grid-lines grid-cols-1 md:grid-cols-2 lg:grid-cols-3 mt-px" id="products-grid">
        <div class="p-stack-md"><div class="nt-skeleton aspect-[4/5]"></div></div>
        <div class="p-stack-md hidden md:block"><div class="nt-skeleton aspect-[4/5]"></div></div>
        <div class="p-stack-md hidden lg:block"><div class="nt-skeleton aspect-[4/5]"></div></div>
    </div>
</main>

<script src="assets/js/api.js"></script>
<script src="assets/js/chrome.js"></script>
<script>NTChrome.mount({ active: "store" });</script>
<script src="assets/js/cart.js"></script>
<script>
    // Índice producto/variantes para resolver la talla elegida al añadir al carrito.
    const productIndex = new Map();
    let catalog = [];

    const SIZE_ORDER = ["S", "M", "L", "XL"];

    function sizeButtons(product) {
        const variants = [...product.variants].sort(
            (a, b) => SIZE_ORDER.indexOf(a.size) - SIZE_ORDER.indexOf(b.size)
        );
        return variants
            .map(
                (v) => `
            <button class="size-btn" data-product="${product.id}" data-variant="${v.id}"
                ${v.stockAvailable <= 0 ? "disabled" : ""}
                title="${v.stockAvailable <= 0 ? "Agotado" : `${v.stockAvailable} disponibles`}">
                ${v.size}
            </button>`
            )
            .join("");
    }

    function productCard(product, { badge = null, disabled = false } = {}) {
        const soldOut = product.status === "AGOTADO" ||
            product.variants.every((v) => v.stockAvailable <= 0);
        const isBlocked = disabled || soldOut;
        const badgeText = badge || (soldOut ? "Agotado" : "Activo");
        const badgeClasses = soldOut
            ? "border-outline text-outline"
            : "border-secondary-container text-secondary-container";
        return `
        <article class="group relative flex flex-col p-stack-md border border-transparent hover:border-secondary-container transition-colors" data-product-card="${product.id}">
            <div data-view="${product.id}" class="relative w-full aspect-[4/5] bg-surface-container overflow-hidden cursor-pointer">
                <img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500 group-hover:scale-[1.03]"
                     src="${ntProductImage(product)}" alt="${ntEscapeHtml(product.name)}"/>
                ${soldOut ? `<div class="absolute inset-0 flex items-center justify-center bg-primary-container/70">
                    <span class="bg-secondary-container text-on-secondary px-3 py-1 font-label-mono text-[12px] uppercase font-bold">Sold Out</span>
                </div>` : ""}
            </div>
            <div class="mt-stack-md flex flex-col flex-grow gap-stack-sm">
                <div class="flex justify-between items-start gap-2">
                    <h2 class="font-headline-lg text-headline-lg-mobile text-on-surface uppercase leading-none pr-2">${ntEscapeHtml(product.name)}</h2>
                    <span class="font-label-mono text-[10px] font-semibold tracking-widest px-2 py-1 border ${badgeClasses} uppercase whitespace-nowrap">${ntEscapeHtml(badgeText)}</span>
                </div>
                <span class="font-label-mono text-label-mono text-secondary-container">${ntFormatMoney(product.price)}</span>
                ${product.description ? `<p class="font-body-md text-[14px] text-on-surface-variant line-clamp-2">${ntEscapeHtml(product.description)}</p>` : ""}
                <div class="flex gap-2 flex-wrap" data-sizes>${sizeButtons(product)}</div>
                <div class="mt-auto pt-stack-md">
                    <button data-add-to-cart="${product.id}" ${isBlocked ? "disabled" : ""}
                        class="w-full bg-transparent border-2 border-on-surface text-on-surface font-headline-lg text-headline-lg-mobile uppercase py-2 hover:bg-on-surface hover:text-primary-container transition-colors disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-on-surface">
                        ${soldOut ? "Sold Out" : disabled ? "Locked" : "Add to Cart"}
                    </button>
                </div>
            </div>
        </article>`;
    }

    // Talla seleccionada por producto
    const selectedVariant = new Map();

    function wireCards(container) {
        // Clic en la imagen → abre el detalle del producto (galería + descripción).
        container.querySelectorAll("[data-view]").forEach((el) => {
            el.addEventListener("click", () => {
                const p = productIndex.get(el.dataset.view);
                if (p) openProductModal(p);
            });
        });

        container.querySelectorAll(".size-btn:not(:disabled)").forEach((btn) => {
            btn.addEventListener("click", () => {
                const productId = btn.dataset.product;
                btn.closest("[data-sizes]").querySelectorAll(".size-btn").forEach((b) => b.classList.remove("selected"));
                btn.classList.add("selected");
                selectedVariant.set(productId, btn.dataset.variant);
            });
        });

        container.querySelectorAll("[data-add-to-cart]:not(:disabled)").forEach((btn) => {
            btn.addEventListener("click", async () => {
                const productId = btn.dataset.addToCart;
                const productVariantId = selectedVariant.get(productId);
                if (!productVariantId) {
                    ntToast("Elige una talla primero", true);
                    return;
                }
                btn.disabled = true;
                try {
                    await NTCart.add({ productId, productVariantId, quantity: 1 });
                    ntToast("Añadido al carrito");
                } catch (err) {
                    ntToast(err.message, true);
                } finally {
                    btn.disabled = false;
                }
            });
        });
    }

    // ------- Catálogo general -------
    function renderCatalog() {
        const grid = document.getElementById("products-grid");
        const sort = document.getElementById("sort-select").value;
        const sorted = [...catalog];
        if (sort === "price-desc") sorted.sort((a, b) => Number(b.price) - Number(a.price));
        if (sort === "price-asc") sorted.sort((a, b) => Number(a.price) - Number(b.price));

        if (!sorted.length) {
            grid.innerHTML = `<div class="md:col-span-2 lg:col-span-3 p-stack-lg text-center">
                <p class="font-label-mono text-label-mono text-on-surface-variant uppercase">El catálogo está vacío por ahora.</p>
            </div>`;
            return;
        }
        grid.innerHTML = sorted.map((p) => productCard(p)).join("");
        wireCards(grid);
    }

    async function loadCatalog() {
        try {
            const { products, pagination } = await ntApi("/shop?page=1&pageSize=60");
            catalog = products;
            products.forEach((p) => productIndex.set(p.id, p));
            document.getElementById("catalog-count").textContent =
                `${pagination.total} producto${pagination.total === 1 ? "" : "s"}`;
            renderCatalog();
        } catch (err) {
            document.getElementById("catalog-count").textContent = "Error";
            document.getElementById("products-grid").innerHTML =
                `<div class="md:col-span-2 lg:col-span-3 p-stack-lg text-center">
                    <p class="font-label-mono text-label-mono text-error uppercase">${ntEscapeHtml(err.message)}</p>
                </div>`;
        }
    }

    // ------- Drops -------
    const dropTimers = [];
    function dropCountdown(el, releaseAt) {
        const target = new Date(releaseAt).getTime();
        const tick = () => {
            const diff = target - Date.now();
            if (diff <= 0) {
                el.textContent = "LIVE NOW — refresca la página";
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            el.textContent = `${d}D ${String(h).padStart(2, "0")}H ${String(m).padStart(2, "0")}M ${String(s).padStart(2, "0")}S`;
        };
        tick();
        dropTimers.push(setInterval(tick, 1000));
    }

    async function loadDrops() {
        try {
            const { drops } = await ntApi("/drops");
            const relevant = drops.filter((d) => d.dropMeta.dropStatus !== "FINALIZADO");
            if (!relevant.length) return;

            document.getElementById("drops").classList.remove("hidden");
            const grid = document.getElementById("drops-grid");
            grid.innerHTML = relevant
                .map((drop) => {
                    const isOpen = drop.dropMeta.dropStatus === "ABIERTO";
                    productIndex.set(drop.id, drop);
                    const card = productCard(drop, {
                        badge: isOpen ? "Drop — Live" : "Próximamente",
                        disabled: !isOpen,
                    });
                    return isOpen
                        ? card
                        : card.replace(
                              "</article>",
                              `<div class="absolute top-2 right-2 bg-secondary-container text-on-secondary px-2 py-1 font-label-mono text-[12px] uppercase font-bold" data-countdown="${drop.dropMeta.releaseAt}"></div></article>`
                          );
                })
                .join("");
            wireCards(grid);
            grid.querySelectorAll("[data-countdown]").forEach((el) => dropCountdown(el, el.dataset.countdown));
        } catch {
            /* la sección de drops permanece oculta si la API falla */
        }
    }

    // ===================== Modal de detalle de producto =====================
    let pmProduct = null;
    let pmVariantId = null;
    let pmImgIndex = 0;

    function mountProductModal() {
        const root = document.createElement("div");
        root.id = "pm-root";
        root.className = "hidden fixed inset-0 z-[700]";
        root.innerHTML = `
            <div id="pm-backdrop" class="absolute inset-0 bg-primary-container/90 backdrop-blur-sm"></div>
            <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
                <div id="pm-panel" class="bg-surface-container-lowest border border-outline-variant w-full max-w-4xl max-h-[90vh] overflow-y-auto pointer-events-auto relative"></div>
            </div>`;
        document.body.appendChild(root);
        root.querySelector("#pm-backdrop").addEventListener("click", closeProductModal);
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeProductModal(); });
    }

    function openProductModal(product) {
        pmProduct = product;
        pmImgIndex = 0;
        pmVariantId = null;
        document.getElementById("pm-root").classList.remove("hidden");
        document.body.style.overflow = "hidden";
        renderProductModal();
    }

    function closeProductModal() {
        const root = document.getElementById("pm-root");
        if (root) root.classList.add("hidden");
        document.body.style.overflow = "";
    }

    function renderProductModal() {
        const p = pmProduct;
        const images = (p.images && p.images.length) ? p.images : [ntPlaceholderImage(p.name)];
        const sizes = [...p.variants].sort((a, b) => SIZE_ORDER.indexOf(a.size) - SIZE_ORDER.indexOf(b.size));
        const soldOut = p.status === "AGOTADO" || p.variants.every((v) => v.stockAvailable <= 0);
        const dropLocked = p.dropMeta && p.dropMeta.dropStatus !== "ABIERTO";
        const canBuy = !soldOut && !dropLocked;

        const thumbs = images.length > 1
            ? `<div class="flex gap-px bg-outline-variant/40">${images.map((img, i) => `
                <button data-thumb="${i}" class="flex-1 h-16 bg-surface-container-lowest overflow-hidden border-b-2 ${i === pmImgIndex ? "border-secondary-container" : "border-transparent"}">
                    <img src="${ntEscapeHtml(img)}" class="w-full h-full object-cover" alt=""/>
                </button>`).join("")}</div>`
            : "";

        const sizeBtns = sizes.map((v) => `
            <button data-size="${v.id}" ${v.stockAvailable <= 0 ? "disabled" : ""}
                class="size-btn ${pmVariantId === v.id ? "selected" : ""}"
                title="${v.stockAvailable <= 0 ? "Agotado" : `${v.stockAvailable} disponibles`}">${v.size}</button>`).join("");

        document.getElementById("pm-panel").innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2">
                <div class="border-b md:border-b-0 md:border-r border-outline-variant">
                    <div class="w-full aspect-square bg-surface-container overflow-hidden border-b border-outline-variant">
                        <img id="pm-main" src="${ntEscapeHtml(images[pmImgIndex])}" class="w-full h-full object-cover" alt="${ntEscapeHtml(p.name)}"/>
                    </div>
                    ${thumbs}
                </div>
                <div class="p-stack-md flex flex-col gap-stack-md relative">
                    <button id="pm-close" class="self-end text-on-surface-variant hover:text-secondary-container transition-colors p-1" aria-label="Cerrar">
                        <span class="material-symbols-outlined text-2xl">close</span>
                    </button>
                    <div>
                        <span class="font-label-mono text-[11px] uppercase tracking-widest ${p.productType === "DROP_EXCLUSIVO" ? "text-secondary-container" : "text-on-surface-variant"}">${p.productType === "DROP_EXCLUSIVO" ? "Drop exclusivo" : "Tienda"}</span>
                        <h2 class="font-headline-xl text-[28px] text-on-surface uppercase leading-none mt-1">${ntEscapeHtml(p.name)}</h2>
                        <p class="font-label-mono text-label-mono text-secondary-container mt-2">${ntFormatMoney(p.price)}</p>
                    </div>
                    ${p.description ? `<p class="font-body-md text-body-md text-on-surface-variant whitespace-pre-line">${ntEscapeHtml(p.description)}</p>` : ""}
                    <div>
                        <span class="font-label-mono text-[11px] text-on-surface-variant uppercase tracking-widest block mb-2">Talla</span>
                        <div class="flex gap-2 flex-wrap" data-modal-sizes>${sizeBtns}</div>
                    </div>
                    ${dropLocked ? `<p class="font-label-mono text-[12px] text-secondary-container uppercase">Disponible el ${new Date(p.dropMeta.releaseAt).toLocaleDateString("es-ES")}</p>` : ""}
                    <button id="pm-add" ${canBuy ? "" : "disabled"}
                        class="w-full bg-secondary-container text-on-secondary font-label-mono text-[13px] tracking-widest uppercase font-bold py-4 hover:bg-on-surface hover:text-primary-container transition-colors disabled:opacity-30 disabled:cursor-not-allowed mt-auto">
                        ${soldOut ? "Agotado" : dropLocked ? "Próximamente" : "Añadir al carrito"}
                    </button>
                </div>
            </div>`;

        const panel = document.getElementById("pm-panel");
        panel.querySelector("#pm-close").addEventListener("click", closeProductModal);
        panel.querySelectorAll("[data-thumb]").forEach((b) =>
            b.addEventListener("click", () => { pmImgIndex = Number(b.dataset.thumb); renderProductModal(); }));
        panel.querySelectorAll("[data-size]:not(:disabled)").forEach((b) =>
            b.addEventListener("click", () => { pmVariantId = b.dataset.size; renderProductModal(); }));
        const addBtn = panel.querySelector("#pm-add");
        if (canBuy) {
            addBtn.addEventListener("click", async () => {
                if (!pmVariantId) { ntToast("Elige una talla primero", true); return; }
                addBtn.disabled = true;
                try {
                    await NTCart.add({ productId: p.id, productVariantId: pmVariantId, quantity: 1 });
                    closeProductModal();
                    ntToast("Añadido al carrito");
                } catch (err) {
                    ntToast(err.message, true);
                    addBtn.disabled = false;
                }
            });
        }
    }

    mountProductModal();

    document.getElementById("sort-select").addEventListener("change", renderCatalog);
    loadCatalog();
    loadDrops();

    // Vuelta de Stripe (return_url): confirmación del pago
    const params = new URLSearchParams(window.location.search);
    if (params.get("redirect_status") === "succeeded") {
        ntToast("Pago completado. ¡Gracias!");
    } else if (params.get("order")) {
        ntToast(`Pedido ${params.get("order")} registrado`);
    }
</script>
</body>
</html>

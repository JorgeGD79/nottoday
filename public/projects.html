<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NOT TODAY - Projects &amp; Portfolio</title>
<link href="favicon.jpg" rel="icon" type="image/jpeg"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind.config.js?v=3"></script>
<link href="assets/css/site.css?v=7" rel="stylesheet"/>
</head>
<body class="antialiased min-h-screen pb-24 md:pb-0">

<main class="w-full max-w-[1440px] mx-auto px-margin-mobile md:px-margin-desktop pt-[140px] pb-[100px] flex flex-col gap-margin-desktop">
    <!-- Header -->
    <header class="flex flex-col gap-stack-md border-b border-outline-variant/20 pb-stack-lg">
        <span class="font-label-mono text-[11px] text-secondary-container uppercase tracking-[0.18em]">Live &amp; Archive</span>
        <h1 class="font-display-lg text-display-lg uppercase text-on-surface max-w-4xl tracking-tighter leading-none mt-2">
            Sonic <br/><span class="text-secondary-container">Architecture</span>
        </h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mt-4">
            El archivo visual y sonoro de Not Today. Desarrollamos nuestros visuales con nuestra propia visión: cada plano forma parte de lo que somos.
        </p>
    </header>

    <!-- Agenda (datos reales de /api/events) -->
    <section class="grid grid-cols-1 md:grid-cols-12 gap-gutter" id="projects-grid">
        <div class="nt-skeleton md:col-span-8 h-[420px]"></div>
        <div class="nt-skeleton md:col-span-4 h-[420px]"></div>
        <div class="nt-skeleton md:col-span-4 aspect-square"></div>
        <div class="nt-skeleton md:col-span-4 aspect-square"></div>
        <div class="nt-skeleton md:col-span-4 aspect-square"></div>
    </section>

    <!-- Marca -->
    <section class="w-full flex justify-center py-margin-desktop border-t border-outline-variant/20">
        <span class="font-display-lg text-[64px] md:text-[120px] text-surface-variant uppercase leading-none tracking-tighter mix-blend-lighten grayscale hover:grayscale-0 hover:text-secondary-container transition-all duration-500 select-none">
            NOT TODAY
        </span>
    </section>
</main>

<script src="assets/js/api.js"></script>
<script src="assets/js/chrome.js"></script>
<script>NTChrome.mount({ active: "projects" });</script>
<script src="assets/js/cart.js"></script>
<script>
    function lineupLabel(ev) {
        const names = ev.lineup.map((l) => l.artist.stageName);
        return names.length ? names.join(" · ") : "Line-up TBA";
    }

    function featuredCard(ev) {
        return `
        <div class="project-card group relative block md:col-span-8 min-h-[420px] bg-primary-container overflow-hidden">
            <div class="absolute inset-0 bg-cover bg-center transition-transform duration-500 ease-out opacity-70 grayscale group-hover:grayscale-0 group-hover:opacity-100 group-hover:scale-105"
                 style="background-image: url('${ev.posterUrl || ntPlaceholderImage(ev.title)}')"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-background via-background/30 to-transparent"></div>
            <div class="absolute bottom-0 left-0 p-stack-lg w-full flex justify-between items-end gap-4">
                <div class="flex flex-col gap-stack-sm">
                    <span class="inline-block font-label-mono text-[11px] text-secondary-container uppercase tracking-[0.14em] w-fit">Event / ${ntEscapeHtml(ev.venue)}</span>
                    <h2 class="font-headline-xl text-[36px] md:text-[48px] text-on-surface uppercase tracking-tight leading-none">${ntEscapeHtml(ev.title)}</h2>
                    <p class="font-label-mono text-label-mono text-on-surface-variant uppercase">${ntFormatEventDate(ev.date)} — ${ntEscapeHtml(lineupLabel(ev))}</p>
                </div>
                <span class="material-symbols-outlined text-on-surface-variant group-hover:text-secondary-container text-4xl transition-colors flex-shrink-0">arrow_outward</span>
            </div>
        </div>`;
    }

    function squareCard(ev, colSpan) {
        return `
        <div class="project-card group relative block ${colSpan} aspect-square bg-primary-container overflow-hidden">
            <div class="absolute inset-0 bg-cover bg-center transition-transform duration-500 ease-out opacity-70 grayscale group-hover:grayscale-0 group-hover:opacity-100 group-hover:scale-105"
                 style="background-image: url('${ev.posterUrl || ntPlaceholderImage(ev.title)}')"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent"></div>
            <div class="absolute bottom-0 left-0 p-stack-md">
                <span class="font-label-mono text-[11px] text-secondary-container uppercase">${ntFormatEventDate(ev.date)}</span>
                <h3 class="font-headline-lg text-[22px] leading-none text-on-surface uppercase tracking-tight mt-1">${ntEscapeHtml(ev.title)}</h3>
                <p class="font-label-mono text-[11px] text-on-surface-variant uppercase mt-1">${ntEscapeHtml(ev.venue)}</p>
            </div>
        </div>`;
    }

    const streamTile = `
        <div class="md:col-span-4 aspect-square bg-primary-container p-stack-lg flex flex-col justify-center items-center text-center gap-stack-md hover:bg-surface-container transition-colors">
            <span class="font-label-mono text-[10px] text-on-surface-variant uppercase tracking-[0.14em]">Spotify</span>
            <h3 class="font-headline-lg text-[28px] text-on-surface uppercase leading-none">Stream<br/>The Archive</h3>
            <p class="font-label-mono text-[12px] text-on-surface-variant">Toda nuestra música, en las plataformas de siempre.</p>
            <div class="flex gap-4 mt-2">
                <a href="https://open.spotify.com/playlist/37i9dQZEVXbNFJfN1Vw8d9?si=bsOQI5LEQV6i9EA1I85Eww&utm_source=copy-link&pi=sqsiaMeRTWCrh" target="_blank" rel="noopener noreferrer" aria-label="Play" class="w-11 h-11 border border-outline-variant flex items-center justify-center hover:bg-secondary-container hover:text-on-secondary hover:border-secondary-container transition-all">
                    <span class="material-symbols-outlined">play_arrow</span>
                </a>
                <a href="#" aria-label="Mixes" class="w-11 h-11 border border-outline-variant flex items-center justify-center hover:bg-secondary-container hover:text-on-secondary hover:border-secondary-container transition-all">
                    <span class="material-symbols-outlined">graphic_eq</span>
                </a>
            </div>
        </div>`;

    async function loadProjects() {
        const grid = document.getElementById("projects-grid");
        grid.className = "nt-grid-lines grid-cols-1 md:grid-cols-12";
        try {
            const { events } = await ntApi("/events");
            if (!events.length) {
                grid.innerHTML = `
                    <div class="md:col-span-8 p-stack-lg flex items-center justify-center min-h-[300px]">
                        <p class="font-label-mono text-label-mono text-on-surface-variant uppercase">Nada programado todavía. El archivo crece pronto.</p>
                    </div>${streamTile}`;
                return;
            }
            const [first, ...rest] = events;
            let html = featuredCard(first);
            if (rest.length) {
                html += squareCard(rest[0], "md:col-span-4");
                html += rest.slice(1).map((ev) => squareCard(ev, "md:col-span-4")).join("");
            }
            html += streamTile;
            grid.innerHTML = html;
        } catch (err) {
            grid.innerHTML = `<div class="md:col-span-12 p-stack-lg text-center">
                <p class="font-label-mono text-label-mono text-error uppercase">${ntEscapeHtml(err.message)}</p>
            </div>`;
        }
    }

    loadProjects();
</script>
</body>
</html>

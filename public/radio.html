<!DOCTYPE html>
<html class="dark scroll-smooth" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>NOT TODAY COLLECTIVE - N-TY Radio</title>
<link href="favicon.jpg" rel="icon" type="image/jpeg"/>
<link href="favicon.jpg" rel="apple-touch-icon"/>
<link href="manifest.webmanifest" rel="manifest"/>
<meta content="#131313" name="theme-color"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind.config.js?v=3"></script>
<link href="assets/css/site.css?v=7" rel="stylesheet"/>
</head>
<body class="antialiased min-h-screen pb-28 md:pb-0">

<main class="w-full">
    <div class="px-margin-mobile md:px-margin-desktop pt-[140px] pb-[100px]">
        <div class="font-label-mono text-[11px] tracking-[0.18em] text-secondary-container uppercase mb-3">LAB</div>
        <h1 class="font-display-lg font-extrabold uppercase tracking-tighter text-on-surface mb-10" style="font-size:clamp(40px,6vw,80px);">N-TY RADIO</h1>

        <div class="nt-grid-lines grid-cols-[repeat(auto-fit,minmax(300px,1fr))]">
            <!-- ON AIR -->
            <div class="p-10 flex flex-col justify-between gap-8 min-h-[340px]">
                <div class="flex items-center gap-2.5 font-label-mono text-[10px] tracking-[0.14em] text-secondary-container uppercase">
                    <span class="w-[7px] h-[7px] bg-secondary-container block"></span>ON AIR
                </div>
                <div>
                    <div id="radio-title" class="font-display-lg font-extrabold uppercase leading-[1.05] tracking-tighter text-on-surface" style="font-size:clamp(28px,3.4vw,44px);">BLOQUE CERO</div>
                    <div id="radio-host" class="font-label-mono text-[12px] text-on-surface-variant tracking-[0.08em] mt-3">KOLD BENNETT</div>
                </div>
                <button id="radio-toggle" type="button" class="self-start flex items-center gap-3 px-6 py-4 font-label-mono text-[12px] tracking-[0.12em] uppercase cursor-pointer transition-colors bg-secondary-container text-on-secondary border border-secondary-container hover:bg-on-surface hover:text-primary-container hover:border-on-surface">
                    <span id="radio-icon" class="material-symbols-outlined text-[18px]">play_arrow</span>
                    <span id="radio-label">ESCUCHAR AHORA</span>
                </button>
            </div>

            <!-- Programación -->
            <div>
                <div class="px-6 py-5 font-label-mono text-[10px] tracking-[0.14em] text-outline uppercase border-b border-outline-variant">PROGRAMACIÓN</div>
                <div id="radio-day-tabs" class="flex gap-1 px-6 py-3 border-b border-outline-variant overflow-x-auto"></div>
                <div id="radio-schedule-list"></div>
            </div>
        </div>
    </div>
</main>

<script src="assets/js/api.js"></script>
<script src="assets/js/chrome.js"></script>
<script>NTChrome.mount({ active: "radio" });</script>
<script src="assets/js/cart.js"></script>
<script>
    // ------- N-TY Radio: parrilla real + reproducción sincronizada -------
    const WEEKDAYS = [
        ["LUNES", "Lunes"], ["MARTES", "Martes"], ["MIERCOLES", "Miércoles"],
        ["JUEVES", "Jueves"], ["VIERNES", "Viernes"], ["SABADO", "Sábado"], ["DOMINGO", "Domingo"],
    ];
    // Date.getDay() de JS: 0=domingo..6=sábado. Convertimos a nuestro enum (lunes primero).
    const JS_DAY_TO_ENUM = ["DOMINGO", "LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES", "SABADO"];

    const radioTitleEl = document.getElementById("radio-title");
    const radioHostEl = document.getElementById("radio-host");
    const radioToggleEl = document.getElementById("radio-toggle");
    const radioIconEl = document.getElementById("radio-icon");
    const radioLabelEl = document.getElementById("radio-label");
    const dayTabsEl = document.getElementById("radio-day-tabs");
    const scheduleListEl = document.getElementById("radio-schedule-list");

    let showsByDay = {};
    let selectedDay = JS_DAY_TO_ENUM[new Date().getDay()];
    let audioEl = null;
    let playing = false;
    let currentTrackId = null;
    let pollTimer = null;

    function renderDayTabs() {
        dayTabsEl.innerHTML = WEEKDAYS.map(([value, label]) => `
            <button type="button" data-day="${value}"
                class="px-3 py-1.5 font-label-mono text-[11px] uppercase tracking-[0.08em] whitespace-nowrap transition-colors ${value === selectedDay ? "bg-secondary-container text-on-secondary" : "text-on-surface-variant hover:text-secondary"}">
                ${label}
            </button>`).join("");
        dayTabsEl.querySelectorAll("[data-day]").forEach((btn) =>
            btn.addEventListener("click", () => {
                selectedDay = btn.dataset.day;
                renderDayTabs();
                renderScheduleList();
            }));
    }

    function renderScheduleList() {
        const shows = (showsByDay[selectedDay] || []).slice().sort((a, b) => a.startTime.localeCompare(b.startTime));
        if (!shows.length) {
            scheduleListEl.innerHTML = `<div class="px-6 py-8 font-label-mono text-[12px] text-on-surface-variant uppercase text-center">Sin franjas este día</div>`;
            return;
        }
        scheduleListEl.innerHTML = shows.map((s) => `
            <div class="flex gap-[18px] px-6 py-[18px] items-baseline border-b border-[#20201f] hover:bg-[#161615] transition-colors last:border-b-0">
                <div class="font-label-mono text-[11px] text-secondary-container w-14 flex-shrink-0">${s.startTime}</div>
                <div>
                    <div class="font-headline-lg font-semibold uppercase text-[15px] text-on-surface">${s.title}</div>
                    <div class="font-label-mono text-[10px] text-outline tracking-[0.06em] mt-1">${s.host}</div>
                </div>
            </div>`).join("");
    }

    function renderOnAir(show, track) {
        radioTitleEl.textContent = show ? show.title : "SIN EMISIÓN";
        radioHostEl.textContent = show ? show.host : "Vuelve pronto";
        radioToggleEl.disabled = !track;
        radioToggleEl.classList.toggle("opacity-40", !track);
        radioToggleEl.classList.toggle("cursor-not-allowed", !track);
    }

    function renderToggleButton() {
        radioIconEl.textContent = playing ? "pause" : "play_arrow";
        radioLabelEl.textContent = playing ? "EN DIRECTO" : "ESCUCHAR AHORA";
        radioToggleEl.classList.toggle("bg-secondary-container", !playing);
        radioToggleEl.classList.toggle("text-on-secondary", !playing);
        radioToggleEl.classList.toggle("bg-transparent", playing);
        radioToggleEl.classList.toggle("text-secondary-container", playing);
    }

    async function fetchSchedule() {
        const { shows } = await ntApi("/radio/schedule");
        showsByDay = {};
        for (const s of shows) (showsByDay[s.dayOfWeek] ||= []).push(s);
        renderDayTabs();
        renderScheduleList();
    }

    async function fetchNowPlaying() {
        return ntApi("/radio/now");
    }

    // Sincroniza el <audio> con lo que debería sonar ahora mismo. Si cambió de
    // pista (cambio de show o fin de playlist), salta al nuevo audio/offset;
    // si sigue siendo la misma pista, no la toca (evita cortes audibles).
    async function syncNowPlaying() {
        const { show, track, offsetSeconds } = await fetchNowPlaying();
        renderOnAir(show, track);
        if (!playing || !track) return;

        if (track.id !== currentTrackId) {
            currentTrackId = track.id;
            audioEl.src = track.audioUrl;
            audioEl.currentTime = offsetSeconds;
            await audioEl.play().catch(() => {});
        }
    }

    radioToggleEl.addEventListener("click", async () => {
        if (!audioEl) {
            audioEl = new Audio();
            audioEl.addEventListener("ended", syncNowPlaying);
        }
        if (playing) {
            playing = false;
            audioEl.pause();
            clearInterval(pollTimer);
            renderToggleButton();
            return;
        }
        try {
            const { show, track, offsetSeconds } = await fetchNowPlaying();
            renderOnAir(show, track);
            if (!track) return;
            currentTrackId = track.id;
            audioEl.src = track.audioUrl;
            audioEl.currentTime = offsetSeconds;
            await audioEl.play();
            playing = true;
            renderToggleButton();
            pollTimer = setInterval(syncNowPlaying, 30000);
        } catch (err) {
            ntToast("No se pudo iniciar la radio", true);
        }
    });

    (async () => {
        try {
            await fetchSchedule();
            const { show, track } = await fetchNowPlaying();
            renderOnAir(show, track);
        } catch (err) {
            renderOnAir(null, null);
        }
        renderToggleButton();
    })();
</script>
</body>
</html>

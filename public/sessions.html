<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NOT TODAY - N-TY Sessions</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&amp;family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind.config.js?v=2"></script>
<link href="assets/css/site.css?v=5" rel="stylesheet"/>
</head>
<body class="antialiased min-h-screen pb-24 md:pb-0">

<main class="w-full max-w-[1440px] mx-auto px-margin-mobile md:px-margin-desktop pt-[140px] pb-[100px] flex flex-col gap-margin-desktop">
    <!-- Header -->
    <header class="flex flex-col gap-stack-md border-b border-outline-variant/20 pb-stack-lg">
        <span class="font-label-mono text-[11px] text-secondary-container uppercase tracking-[0.18em]">Lab / Live &amp; Unedited</span>
        <h1 class="font-display-lg text-display-lg uppercase text-on-surface max-w-4xl tracking-tighter leading-none mt-2">
            N-TY <br/><span class="text-secondary-container">Sessions</span>
        </h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mt-4">
            Nuestra música, grabada con nuestra propia visión. Un artista, una sala, una toma — sin ediciones. Sets completos en YouTube.
        </p>
    </header>

    <!-- Reproductor destacado + lista (datos reales de /api/sessions) -->
    <section id="sessions-section">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter" id="sessions-layout">
            <div class="nt-skeleton lg:col-span-8 aspect-video"></div>
            <div class="flex flex-col gap-gutter lg:col-span-4">
                <div class="nt-skeleton h-[120px]"></div>
                <div class="nt-skeleton h-[120px]"></div>
            </div>
        </div>
    </section>
</main>

<script src="assets/js/api.js"></script>
<script src="assets/js/chrome.js"></script>
<script>NTChrome.mount({ active: "sessions" });</script>
<script src="assets/js/cart.js"></script>
<script>
    let allSessions = [];

    function playerHtml(session) {
        const videoId = ntYoutubeId(session.youtubeUrl);
        const date = new Date(session.publishedAt).toLocaleDateString("en-GB", {
            year: "numeric", month: "short", day: "2-digit",
        }).toUpperCase();
        const frame = videoId
            ? `<iframe class="w-full h-full" src="https://www.youtube-nocookie.com/embed/${videoId}"
                 title="${ntEscapeHtml(session.title)}" frameborder="0"
                 referrerpolicy="strict-origin-when-cross-origin"
                 allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                 allowfullscreen></iframe>`
            : `<div class="w-full h-full flex items-center justify-center">
                 <a href="${ntEscapeHtml(session.youtubeUrl)}" target="_blank" rel="noopener noreferrer"
                    class="font-label-mono text-label-mono text-secondary-container uppercase">Watch on YouTube -&gt;</a>
               </div>`;
        return `
        <div class="lg:col-span-8 flex flex-col">
            <div class="relative w-full aspect-video bg-primary-container overflow-hidden" id="player-frame">
                ${frame}
            </div>
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-stack-md p-stack-lg border-t border-outline-variant/30">
                <div>
                    <span class="font-label-mono text-[11px] text-secondary-container uppercase tracking-[0.18em]">Reproduciendo ahora</span>
                    <h2 class="font-headline-xl text-[32px] md:text-[44px] text-on-surface uppercase leading-none mt-2">${ntEscapeHtml(session.title)}</h2>
                    <p class="font-label-mono text-label-mono text-on-surface-variant uppercase mt-2">
                        <a href="artists.html" class="text-secondary-container hover:text-on-surface transition-colors">${ntEscapeHtml(session.artist.stageName)}</a> — ${date}
                    </p>
                    ${session.description ? `<p class="font-body-md text-body-md text-on-surface-variant mt-3 max-w-xl">${ntEscapeHtml(session.description)}</p>` : ""}
                </div>
                <a href="${ntEscapeHtml(session.youtubeUrl)}" target="_blank" rel="noopener noreferrer"
                   class="font-label-mono text-label-mono uppercase border border-outline-variant/40 px-4 py-2 text-on-surface-variant hover:border-secondary-container hover:text-secondary-container transition-colors whitespace-nowrap flex items-center gap-1 w-fit flex-shrink-0">
                    Open on YouTube <span class="material-symbols-outlined text-[16px]">arrow_outward</span>
                </a>
            </div>
        </div>`;
    }

    function sessionTile(session, isActive) {
        const thumb = ntYoutubeThumb(session.youtubeUrl) || ntPlaceholderImage(session.title);
        const date = new Date(session.publishedAt).toLocaleDateString("en-GB", {
            month: "short", day: "2-digit",
        }).toUpperCase();
        return `
        <button data-session="${session.id}" id="${session.id}"
            class="group flex gap-stack-md p-stack-md text-left w-full items-center border-b border-outline-variant/20 border-l-2 transition-colors hover:bg-[#161615] ${isActive ? "!bg-[#161615] border-secondary-container" : "border-transparent"}">
            <div class="w-[60px] h-11 flex-shrink-0 relative overflow-hidden bg-gradient-to-br from-surface-container-high to-primary-container flex items-center justify-center">
                <img class="absolute inset-0 w-full h-full object-cover ${isActive ? "" : "grayscale group-hover:grayscale-0"} transition-all duration-300" src="${thumb}" alt=""/>
                <span class="material-symbols-outlined relative z-10 text-[16px] ${isActive ? "text-secondary-container" : "text-on-surface"}" style="font-variation-settings: 'FILL' 1;">${isActive ? "equalizer" : "play_arrow"}</span>
            </div>
            <div class="flex flex-col justify-center min-w-0">
                <h3 class="font-headline-lg text-[14px] ${isActive ? "text-secondary-container" : "text-on-surface"} uppercase leading-tight truncate">${ntEscapeHtml(session.title)}</h3>
                <p class="font-label-mono text-[10px] text-on-surface-variant uppercase mt-1 truncate">${ntEscapeHtml(session.artist.stageName)} — ${date}</p>
            </div>
        </button>`;
    }

    function render(activeId) {
        const layout = document.getElementById("sessions-layout");
        layout.className = "nt-grid-lines grid-cols-1 lg:grid-cols-12";
        const active = allSessions.find((s) => s.id === activeId) || allSessions[0];
        const tiles = allSessions.map((s) => sessionTile(s, s.id === active.id)).join("");
        layout.innerHTML =
            playerHtml(active) +
            `<aside class="lg:col-span-4 flex flex-col max-h-[600px] overflow-y-auto">
                <div class="flex items-end justify-between border-b border-outline-variant/30 p-stack-md sticky top-0 bg-surface-container-lowest z-10">
                    <h2 class="font-label-mono text-[11px] text-on-surface-variant uppercase tracking-[0.14em]">Archivo</h2>
                    <span class="font-label-mono text-[11px] text-on-surface-variant uppercase">${allSessions.length} set${allSessions.length === 1 ? "" : "s"}</span>
                </div>
                ${tiles}
            </aside>`;

        layout.querySelectorAll("[data-session]").forEach((btn) =>
            btn.addEventListener("click", () => {
                render(btn.dataset.session);
                document.getElementById("player-frame").scrollIntoView({ behavior: "smooth", block: "center" });
            })
        );
    }

    async function loadSessions() {
        const layout = document.getElementById("sessions-layout");
        try {
            const { sessions } = await ntApi("/sessions");
            if (!sessions.length) {
                layout.innerHTML = `
                <div class="lg:col-span-12 border border-outline-variant/20 p-stack-lg text-center">
                    <p class="font-label-mono text-label-mono text-on-surface-variant uppercase">Primera sesión muy pronto.</p>
                </div>`;
                return;
            }
            allSessions = sessions;
            // Enlace directo desde artists.html (#sessionId)
            const anchor = window.location.hash.slice(1);
            render(anchor || null);
        } catch (err) {
            layout.innerHTML = `<div class="lg:col-span-12 border border-error/40 p-stack-lg text-center">
                <p class="font-label-mono text-label-mono text-error uppercase">${ntEscapeHtml(err.message)}</p>
            </div>`;
        }
    }

    loadSessions();
</script>
</body>
</html>

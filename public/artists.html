<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NOT TODAY - Artists</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind.config.js?v=3"></script>
<link href="assets/css/site.css?v=7" rel="stylesheet"/>
</head>
<body class="bg-background text-on-background font-body-md antialiased pb-24 md:pb-0">

<main class="w-full max-w-[1440px] mx-auto px-margin-mobile md:px-margin-desktop pt-[140px] flex flex-col gap-margin-desktop">
    <!-- Header -->
    <header class="flex flex-col gap-stack-md border-b border-outline-variant/20 pb-stack-lg">
        <h1 class="font-display-lg text-display-lg uppercase text-on-surface max-w-4xl tracking-tighter leading-none">
            Raw <br/><span class="text-secondary-container">Talent</span>
        </h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mt-4">
            Nuestro roster. Los que producen la música que nos define: industrial, hard techno y bass experimental. Sin relleno — cada nombre se gana su sitio.
        </p>
    </header>

    <!-- Roster (datos reales de /api/artists) -->
    <section class="nt-grid-lines grid-cols-1 md:grid-cols-2" id="artists-grid">
        <div class="nt-skeleton h-[480px]"></div>
        <div class="nt-skeleton h-[480px]"></div>
    </section>

    <!-- CTA -->
    <section class="w-full flex flex-col items-center justify-center text-center gap-stack-md py-margin-desktop border-t border-outline-variant/20">
        <h2 class="font-headline-xl text-[40px] md:text-[64px] text-on-surface uppercase leading-none tracking-tighter">
            ¿Los quieres en tu cartel?
        </h2>
        <a href="booking.html" class="bg-transparent border-2 border-secondary-container text-secondary-container font-headline-lg text-[24px] uppercase px-8 py-4 hover:bg-secondary-container hover:text-on-secondary transition-colors mt-stack-md">
            Book an Artist
        </a>
    </section>
</main>

<script src="assets/js/api.js"></script>
<script src="assets/js/chrome.js"></script>
<script>NTChrome.mount({ active: "artists" });</script>
<script src="assets/js/cart.js"></script>
<script>
    let allArtists = [];

    function socialLinks(artist) {
        const links = [];
        if (artist.spotifyId) {
            const href = artist.spotifyId.startsWith("http")
                ? artist.spotifyId
                : `https://open.spotify.com/artist/${artist.spotifyId}`;
            links.push({ label: "Spotify", href });
        }
        if (artist.youtube) links.push({ label: "YouTube", href: artist.youtube });
        if (artist.soundcloudId) {
            const href = artist.soundcloudId.startsWith("http")
                ? artist.soundcloudId
                : `https://soundcloud.com/${artist.soundcloudId}`;
            links.push({ label: "SoundCloud", href });
        }
        if (artist.instagram) {
            const handle = artist.instagram.replace(/^@/, "");
            const href = handle.startsWith("http") ? handle : `https://instagram.com/${handle}`;
            links.push({ label: "Instagram", href });
        }
        return links
            .map(
                (l) => `
            <a href="${l.href}" target="_blank" rel="noopener noreferrer"
               class="font-label-mono text-[12px] uppercase tracking-widest border border-outline-variant px-3 py-1.5 text-on-surface-variant hover:border-secondary-container hover:text-secondary-container transition-colors flex items-center gap-1">
                ${l.label} <span class="material-symbols-outlined text-[14px]">arrow_outward</span>
            </a>`
            )
            .join("");
    }

    function artistSessions(artist) {
        if (!artist.sessions.length) return "";
        const items = artist.sessions
            .map(
                (s) => `
            <a href="sessions.html#${s.id}" class="flex justify-between items-center border border-outline-variant/40 px-3 py-2 hover:border-secondary-container transition-colors group/session">
                <span class="font-label-mono text-[12px] text-on-surface uppercase">${ntEscapeHtml(s.title)}</span>
                <span class="material-symbols-outlined text-[16px] text-on-surface-variant group-hover/session:text-secondary-container transition-colors">play_arrow</span>
            </a>`
            )
            .join("");
        return `
        <div class="flex flex-col gap-2 mt-stack-md">
            <span class="font-label-mono text-[11px] text-secondary-container uppercase tracking-widest">N-TY Sessions</span>
            ${items}
        </div>`;
    }

    function artistCard(artist) {
        const photo = (artist.images && artist.images[0]) || ntPlaceholderImage(artist.stageName);
        return `
        <article class="group relative flex flex-col p-stack-md gap-stack-md">
            <div data-artist="${artist.id}" class="relative w-full aspect-[4/3] bg-surface-container overflow-hidden cursor-pointer">
                <img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500 group-hover:scale-[1.03]"
                     src="${photo}" alt="${ntEscapeHtml(artist.stageName)}"/>
                <span class="absolute top-2 right-2 font-label-mono text-[10px] uppercase tracking-widest text-on-surface bg-primary-container/80 border border-outline-variant px-2 py-1 opacity-0 group-hover:opacity-100 transition-opacity">Ver perfil</span>
            </div>
            <div class="flex flex-col flex-grow gap-stack-sm">
                <h2 class="font-headline-xl text-[32px] text-on-surface uppercase leading-none tracking-tighter">
                    ${ntEscapeHtml(artist.stageName)}
                </h2>
                <p class="font-body-md text-body-md text-on-surface-variant line-clamp-3">${ntEscapeHtml(artist.bio || "Bio coming soon.")}</p>
                <div class="flex flex-wrap gap-2">${socialLinks(artist)}</div>
                ${artistSessions(artist)}
                <div class="mt-auto pt-stack-md">
                    <a href="booking.html" class="inline-flex items-center gap-2 font-headline-lg text-[20px] uppercase text-secondary-container hover:text-on-surface transition-colors">
                        Book ${ntEscapeHtml(artist.stageName)} <span class="material-symbols-outlined">arrow_forward</span>
                    </a>
                </div>
            </div>
        </article>`;
    }

    async function loadArtists() {
        const grid = document.getElementById("artists-grid");
        try {
            const { artists } = await ntApi("/artists");
            if (!artists.length) {
                grid.innerHTML = `
                <div class="md:col-span-2 p-stack-lg text-center">
                    <p class="font-label-mono text-label-mono text-on-surface-variant uppercase">Roster en construcción.</p>
                </div>`;
                return;
            }
            allArtists = artists;
            grid.innerHTML = artists.map(artistCard).join("");
            grid.querySelectorAll("[data-artist]").forEach((el) =>
                el.addEventListener("click", () => {
                    const a = allArtists.find((x) => x.id === el.dataset.artist);
                    if (a) openArtistModal(a);
                }));
        } catch (err) {
            grid.innerHTML = `<div class="md:col-span-2 p-stack-lg text-center">
                <p class="font-label-mono text-label-mono text-error uppercase">${ntEscapeHtml(err.message)}</p>
            </div>`;
        }
    }

    // ===================== Modal de detalle de artista =====================
    let amArtist = null;
    let amImgIndex = 0;

    function mountArtistModal() {
        const root = document.createElement("div");
        root.id = "am-root";
        root.className = "hidden fixed inset-0 z-[700]";
        root.innerHTML = `
            <div id="am-backdrop" class="absolute inset-0 bg-primary-container/90 backdrop-blur-sm"></div>
            <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
                <div id="am-panel" class="bg-surface-container-lowest border border-outline-variant w-full max-w-4xl max-h-[90vh] overflow-y-auto pointer-events-auto relative"></div>
            </div>`;
        document.body.appendChild(root);
        root.querySelector("#am-backdrop").addEventListener("click", closeArtistModal);
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeArtistModal(); });
    }

    function openArtistModal(artist) {
        amArtist = artist;
        amImgIndex = 0;
        document.getElementById("am-root").classList.remove("hidden");
        document.body.style.overflow = "hidden";
        renderArtistModal();
    }

    function closeArtistModal() {
        const root = document.getElementById("am-root");
        if (root) root.classList.add("hidden");
        document.body.style.overflow = "";
    }

    function renderArtistModal() {
        const a = amArtist;
        const images = (a.images && a.images.length) ? a.images : [ntPlaceholderImage(a.stageName)];
        const thumbs = images.length > 1
            ? `<div class="flex gap-px bg-outline-variant/40">${images.map((img, i) => `
                <button data-thumb="${i}" class="flex-1 h-16 bg-surface-container-lowest overflow-hidden border-b-2 ${i === amImgIndex ? "border-secondary-container" : "border-transparent"}">
                    <img src="${ntEscapeHtml(img)}" class="w-full h-full object-cover" alt=""/>
                </button>`).join("")}</div>`
            : "";
        document.getElementById("am-panel").innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2">
                <div class="border-b md:border-b-0 md:border-r border-outline-variant">
                    <div class="w-full aspect-square bg-surface-container overflow-hidden border-b border-outline-variant">
                        <img id="am-main" src="${ntEscapeHtml(images[amImgIndex])}" class="w-full h-full object-cover" alt="${ntEscapeHtml(a.stageName)}"/>
                    </div>
                    ${thumbs}
                </div>
                <div class="p-stack-md flex flex-col gap-stack-md relative">
                    <button id="am-close" class="self-end text-on-surface-variant hover:text-secondary-container transition-colors p-1" aria-label="Cerrar">
                        <span class="material-symbols-outlined text-2xl">close</span>
                    </button>
                    <h2 class="font-headline-xl text-[28px] text-on-surface uppercase leading-none">${ntEscapeHtml(a.stageName)}</h2>
                    ${a.bio ? `<p class="font-body-md text-body-md text-on-surface-variant whitespace-pre-line">${ntEscapeHtml(a.bio)}</p>` : ""}
                    <div class="flex flex-wrap gap-2">${socialLinks(a)}</div>
                    ${artistSessions(a)}
                    <a href="booking.html" class="inline-flex items-center gap-2 font-headline-lg text-[20px] uppercase text-secondary-container hover:text-on-surface transition-colors mt-auto pt-stack-md">
                        Book ${ntEscapeHtml(a.stageName)} <span class="material-symbols-outlined">arrow_forward</span>
                    </a>
                </div>
            </div>`;
        const panel = document.getElementById("am-panel");
        panel.querySelector("#am-close").addEventListener("click", closeArtistModal);
        panel.querySelectorAll("[data-thumb]").forEach((b) =>
            b.addEventListener("click", () => { amImgIndex = Number(b.dataset.thumb); renderArtistModal(); }));
    }

    mountArtistModal();
    loadArtists();
</script>
</body>
</html>

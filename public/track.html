<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NOT TODAY - Seguimiento de pedido</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&amp;family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind.config.js?v=2"></script>
<link href="assets/css/site.css?v=6" rel="stylesheet"/>
</head>
<body class="antialiased min-h-screen pb-24 md:pb-0">

<main class="w-full max-w-[1100px] mx-auto px-margin-mobile md:px-margin-desktop pt-[140px] pb-[100px] flex flex-col gap-stack-lg">
    <!-- Header -->
    <header class="flex flex-col gap-stack-md border-b border-outline-variant/20 pb-stack-lg">
        <span class="font-label-mono text-[11px] text-secondary-container uppercase tracking-[0.18em]">Order Tracking</span>
        <h1 class="font-display-lg text-display-lg uppercase text-on-surface tracking-tighter leading-none mt-2">
            Tu <br/><span class="text-secondary-container">Pedido</span>
        </h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mt-4">
            Cada pieza sale de nuestras manos a las tuyas. Introduce tu número de pedido y el email de compra para ver en qué punto está.
        </p>
    </header>

    <!-- Formulario de consulta -->
    <section class="nt-card max-w-2xl" id="track-form-card">
        <form id="track-form" class="space-y-6" novalidate>
            <div>
                <label class="nt-label" for="track-order">Nº de pedido</label>
                <input class="nt-input font-label-mono" id="track-order" type="text" placeholder="cmr..." required autocomplete="off"/>
            </div>
            <div>
                <label class="nt-label" for="track-email">Email de compra</label>
                <input class="nt-input" id="track-email" type="email" placeholder="tu@email.com" required autocomplete="email"/>
            </div>
            <button class="btn-primary" type="submit">Consultar <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">search</span></button>
            <p id="track-error" class="hidden font-label-mono text-[12px] text-error uppercase"></p>
        </form>
    </section>

    <!-- Resultado -->
    <section class="hidden grid-cols-1 lg:grid-cols-12 gap-gutter" id="track-result"></section>
</main>

<script src="assets/js/api.js"></script>
<script src="assets/js/chrome.js"></script>
<script>NTChrome.mount({ active: "track" });</script>
<script src="assets/js/cart.js"></script>
<script>
    const fmtLong = (iso) =>
        new Date(iso).toLocaleString("es-ES", { day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });

    // Timeline: cada hito con estado done / current / pending / failed
    function buildSteps(order) {
        const payFailed = order.status === "FALLIDO" || order.status === "CANCELADO";
        const paid = order.status === "PAGADO";
        const shipped = order.fulfillmentStatus === "ENVIADO" || order.fulfillmentStatus === "ENTREGADO";
        const delivered = order.fulfillmentStatus === "ENTREGADO";

        return [
            {
                title: "Pedido recibido",
                detail: fmtLong(order.createdAt),
                state: "done",
            },
            {
                title: payFailed ? "Pago fallido" : "Pago",
                detail: payFailed
                    ? "El pago no se completó y el stock fue liberado. Vuelve a intentarlo en la tienda."
                    : paid ? "Pago confirmado" : "Esperando confirmación del pago",
                state: payFailed ? "failed" : paid ? "done" : "current",
            },
            {
                title: "Enviado",
                detail: shipped
                    ? `${order.shippingMethodName || "Envío"} — en camino a ${[order.shippingCity, order.shippingCountry].filter(Boolean).join(", ")}`
                    : "Preparando tu pedido",
                tracking: shipped ? order.trackingCode : null,
                state: shipped ? "done" : paid ? "current" : "pending",
            },
            {
                title: "Entregado",
                detail: delivered ? `Entregado — ${fmtLong(order.updatedAt)}` : "",
                state: delivered ? "done" : shipped ? "current" : "pending",
            },
        ];
    }

    function stepHtml(step, isLast) {
        const palette = {
            done:    { dot: "bg-secondary-container border-secondary-container", line: "bg-secondary-container", title: "text-on-surface" },
            current: { dot: "bg-transparent border-secondary-container", line: "bg-outline-variant/40", title: "text-on-surface" },
            pending: { dot: "bg-transparent border-outline-variant", line: "bg-outline-variant/40", title: "text-on-surface-variant" },
            failed:  { dot: "bg-error-container border-error", line: "bg-outline-variant/40", title: "text-error" },
        }[step.state];
        return `
        <div class="flex gap-4">
            <div class="flex flex-col items-center">
                <span class="w-3 h-3 border-2 ${palette.dot} flex-shrink-0 mt-1"></span>
                ${isLast ? "" : `<span class="w-0.5 flex-grow ${palette.line} my-1"></span>`}
            </div>
            <div class="pb-8 min-w-0">
                <h3 class="font-headline-lg text-[20px] uppercase leading-none tracking-tight ${palette.title}">${step.title}</h3>
                ${step.detail ? `<p class="font-body-md text-[14px] text-on-surface-variant mt-1.5">${ntEscapeHtml(step.detail)}</p>` : ""}
                ${step.tracking ? `
                <button class="mt-3 flex items-center gap-2 border border-secondary-container px-3 py-1.5 font-label-mono text-[12px] text-secondary-container uppercase tracking-[0.06em] hover:bg-secondary-container hover:text-on-secondary transition-colors" data-copy="${ntEscapeHtml(step.tracking)}">
                    ${ntEscapeHtml(step.tracking)} <span class="material-symbols-outlined text-[16px]">content_copy</span>
                </button>` : ""}
            </div>
        </div>`;
    }

    function renderOrder(order) {
        const steps = buildSteps(order);
        const result = document.getElementById("track-result");
        result.classList.remove("hidden");
        result.classList.add("grid");
        result.innerHTML = `
        <div class="lg:col-span-7 nt-card">
            <div class="flex items-start justify-between gap-4 mb-stack-lg flex-wrap">
                <div>
                    <span class="font-label-mono text-[11px] text-secondary-container uppercase tracking-widest">Estado del pedido</span>
                    <p class="font-label-mono text-[12px] text-on-surface-variant mt-1 break-all">${ntEscapeHtml(order.id)}</p>
                </div>
            </div>
            <div class="flex flex-col">${steps.map((s, i) => stepHtml(s, i === steps.length - 1)).join("")}</div>
        </div>
        <div class="lg:col-span-5 nt-card h-fit">
            <span class="font-label-mono text-[11px] text-secondary-container uppercase tracking-widest">Resumen</span>
            <div class="mt-stack-md space-y-3">
                ${order.items.map((i) => `
                    <div class="flex justify-between gap-3 border-b border-outline-variant/20 pb-3">
                        <span class="font-body-md text-[14px] text-on-surface">${i.quantity}x ${ntEscapeHtml(i.product.name)} <span class="text-on-surface-variant">(${i.productVariant.size})</span></span>
                        <span class="font-label-mono text-[13px] text-on-surface-variant whitespace-nowrap">${ntFormatMoney(Number(i.unitPrice) * i.quantity)}</span>
                    </div>`).join("")}
            </div>
            <div class="mt-stack-md space-y-2 font-label-mono text-[13px]">
                <div class="flex justify-between text-on-surface-variant"><span class="uppercase">Subtotal</span><span>${ntFormatMoney(order.subtotal)}</span></div>
                ${Number(order.discountAmount) > 0 ? `<div class="flex justify-between text-secondary-container"><span class="uppercase">Descuento</span><span>-${ntFormatMoney(order.discountAmount)}</span></div>` : ""}
                <div class="flex justify-between text-on-surface-variant"><span class="uppercase">Envío${order.shippingMethodName ? ` · ${ntEscapeHtml(order.shippingMethodName)}` : ""}</span><span>${Number(order.shippingCost) === 0 ? "Gratis" : ntFormatMoney(order.shippingCost)}</span></div>
                <div class="flex justify-between text-on-surface border-t border-outline-variant/30 pt-2"><span class="uppercase font-bold">Total</span><span class="font-bold">${ntFormatMoney(order.total)}</span></div>
            </div>
        </div>`;

        result.querySelectorAll("[data-copy]").forEach((btn) =>
            btn.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(btn.dataset.copy);
                    ntToast("Tracking copiado");
                } catch {
                    ntToast("No se pudo copiar", true);
                }
            })
        );
        result.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function lookup(orderId, email) {
        const errEl = document.getElementById("track-error");
        errEl.classList.add("hidden");
        const resultEl = document.getElementById("track-result");
        resultEl.classList.add("hidden");
        resultEl.classList.remove("grid");
        try {
            const { order } = await ntApi(`/orders/${encodeURIComponent(orderId)}?email=${encodeURIComponent(email)}`);
            renderOrder(order);
        } catch (err) {
            errEl.textContent = err.status === 404
                ? "No encontramos ningún pedido con ese número y email."
                : err.message;
            errEl.classList.remove("hidden");
        }
    }

    document.getElementById("track-form").addEventListener("submit", (e) => {
        e.preventDefault();
        if (!e.target.reportValidity()) return;
        lookup(
            document.getElementById("track-order").value.trim(),
            document.getElementById("track-email").value.trim()
        );
    });

    // Prefill + consulta automática desde la confirmación del checkout
    const params = new URLSearchParams(window.location.search);
    const qOrder = params.get("order");
    const qEmail = params.get("email");
    if (qOrder) document.getElementById("track-order").value = qOrder;
    if (qEmail) document.getElementById("track-email").value = qEmail;
    if (qOrder && qEmail) lookup(qOrder, qEmail);
</script>
</body>
</html>
